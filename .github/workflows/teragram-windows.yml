name: Teragram Windows build and verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teragram-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      RUST_TEST_THREADS: '4'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - name: Install locked frontend dependencies
        working-directory: app
        run: npm ci
      - name: Validate publication and security policy
        run: |
          $checks = @(
            'scripts/check-test-policy.cjs',
            'scripts/check-app-security.cjs',
            'scripts/check-workflow-pins.cjs',
            'scripts/check-rust-formatting.cjs'
          )
          foreach ($check in $checks) {
            node $check
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          node scripts/check-android-publication.cjs --tracked-only --strict
      - name: Verify workflow policy with Windows line endings
        run: node --test --test-name-pattern="workflow protection CLI" scripts/e2e/assurance.e2e.cjs
      - name: Validate localization and production frontend
        working-directory: app
        run: |
          npm run i18n:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:verify
      - name: Install browser
        working-directory: app
        run: npx playwright install chromium
      - name: Exercise the complete desktop browser journeys on Windows
        working-directory: app
        run: npm run teragram:test
      - name: Check native formatting
        working-directory: app/src-tauri
        run: cargo fmt --all -- --check
      - name: Exercise native process, storage and HTTP journeys on Windows
        working-directory: app/src-tauri
        run: cargo test --locked --features native-e2e --test native_e2e
      - name: Repeat the in-flight account revocation regression
        working-directory: app/src-tauri
        run: |
          foreach ($attempt in 1..5) {
            cargo test --locked --features native-e2e --test native_e2e media_http_ranges_filenames_failures_and_account_revocation -- --exact
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Lint Windows native targets
        working-directory: app/src-tauri
        run: cargo clippy --locked --features native-e2e --lib --all-targets -- -D warnings
      - name: Verify packaged startup harness failure handling
        run: node scripts/e2e/packaged-startup.e2e.cjs
      - name: Download and verify the Microsoft runtime
        run: ./app/scripts/prepare-windows-runtime.ps1
      - name: Build the Teragram Windows installer
        working-directory: app
        run: npm run teragram:build
      - name: Inspect the installer and Windows runtime dependencies
        run: ./app/scripts/verify-windows-bundle.ps1
      - name: Install and launch the packaged app in the disposable Windows runner
        run: ./scripts/smoke-windows-package.ps1
      - name: Prepare checked release candidate
        run: ./scripts/prepare-teragram-windows-artifact.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: teragram-windows-x64-candidate
          path: release-assets/windows/
          if-no-files-found: error
          retention-days: 14
      - name: Retain verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: teragram-windows-verification
          path: |
            app/test-results/
            app/playwright-report/
            app/dist/bundle-report.json
          if-no-files-found: ignore
