name: Visual regression

on:
  pull_request:
    paths:
      - 'app/src/**'
      - 'app/tests/**'
      - 'app/playwright.config.ts'
      - 'app/package.json'
      - 'app/package-lock.json'
      - '.github/workflows/visual-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  design-gallery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Configure Ubuntu package downloads
        run: |
          sudo find /etc/apt -maxdepth 2 -type f \( -name '*.list' -o -name '*.sources' \) -exec sed -i 's|https\?://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' {} +
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-teragram-ci
      - run: npx playwright install --with-deps chromium
      - run: npm run visual:test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: visual-regression-report
          path: app/test-results
          if-no-files-found: ignore
